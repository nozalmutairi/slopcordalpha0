<style>
:root{--bg:#fff;--bg2:#f2f3f5;--bg3:#e3e5e8;--tx:#313338;--mut:#5c5e66;--hov:#d9dbde;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg3);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--tx:#dbdee1;--mut:#949ba4;--hov:#393c41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--tx:#dbdee1;--mut:#949ba4;--hov:#393c41;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"gg sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid #5865f2;outline-offset:2px}
.app{display:flex;height:100%;position:relative;overflow:hidden}
.side{display:flex;flex:none}
.rail{width:72px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
.sv{width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);color:var(--tx);font-size:18px;font-weight:600;cursor:pointer;transition:border-radius .15s,background .15s}
.sv:hover,.sv.on{border-radius:16px;background:var(--c);color:#fff}
.chs{width:240px;background:var(--bg2);display:flex;flex-direction:column}
.chs h2{margin:0;padding:0 16px;height:48px;line-height:48px;font-size:15px;border-bottom:1px solid var(--bg3)}
.chl{flex:1;overflow-y:auto;padding:8px}
.ch{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mut);padding:8px 10px;border-radius:4px;font-size:15px;font-weight:500;cursor:pointer}
.ch:hover,.ch.on{background:var(--hov);color:var(--tx)}
.me{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:0 12px;height:48px;border-bottom:1px solid var(--bg3);font-weight:600;flex:none}
.menu{display:none;border:0;background:none;font-size:22px;cursor:pointer;padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:16px 0}
.m{display:flex;gap:12px;padding:2px 16px}
.m.f{margin-top:14px}
.m:hover{background:var(--bg2)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600}
.sp{width:40px;flex:none}
.nm{font-weight:600}
.tm{color:var(--mut);font-size:12px;margin-left:8px}
.tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.empty{color:var(--mut);padding:0 16px}
.cmp{padding:0 16px 16px;flex:none}
.cmp input{width:100%;box-sizing:border-box;border:0;border-radius:8px;background:var(--bg3);padding:12px 14px;font-size:16px}
.mem{width:240px;background:var(--bg2);padding:16px 8px;overflow-y:auto;flex:none}
.mem p{margin:0 8px 8px;color:var(--mut);font-size:13px}
.mem .me{background:none;border-radius:4px}
.scrim{display:none}
@media(max-width:900px){.mem{display:none}}
@media(max-width:700px){
.menu{display:block}
.side{position:absolute;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;z-index:5}
.app.open .side{transform:none}
.app.open .scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:4}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg3);padding:16px;overflow:auto}
[hidden]{display:none!important}
.card{width:100%;max-width:380px;background:var(--bg);border-radius:8px;padding:24px;box-sizing:border-box}
.card h1{margin:0 0 4px;font-size:24px}
.card p{color:var(--mut);margin:0 0 16px}
.card input{width:100%;box-sizing:border-box;border:0;border-radius:4px;background:var(--bg3);padding:12px;font-size:16px;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:4px;background:#5865f2;color:#fff;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
.lnk{background:none;border:0;color:#5865f2;cursor:pointer;padding:8px 0;font-size:14px}
.err{color:#da373c;min-height:20px;font-size:14px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:0;border-radius:12px;background:var(--bg3);padding:6px 10px;cursor:pointer;font-size:14px}
.rules{list-style:none;margin:0 0 12px;padding:0;font-size:14px;color:var(--mut)}
.rules li::before{content:"○ "}
.rules li.ok{color:#3ba55d}
.rules li.ok::before{content:"✓ "}
.logo{margin-left:auto;border:0;background:none;cursor:pointer;font-size:18px;font-weight:800;letter-spacing:.5px;color:#5865f2;padding:4px 6px}
.logo span{display:inline-block}
.logo.go span{animation:hop .5s ease calc(var(--i)*60ms)}
@keyframes hop{0%,100%{transform:none;color:#5865f2}40%{transform:translateY(-9px) rotate(-10deg);color:#eb459e}}
@media(prefers-reduced-motion:reduce){.logo.go span{animation:none}}
.chl .lnk{display:block;padding:12px 10px 0;text-align:left}
.card .lnk{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="side">
    <nav class="rail" id="rail" aria-label="Servers"></nav>
    <aside class="chs">
      <h2 id="sn"></h2>
      <div class="chl" id="chl"></div>
      <div class="me"><div class="av" id="mav"></div><div><div class="nm" id="mnm"></div><div class="tm" style="margin:0">Online</div></div><button class="lnk" id="sw" style="margin-left:auto" title="Switch or add account">Switch</button></div>
    </aside>
  </div>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top"><button class="menu" id="menu" aria-label="Open servers and channels">☰</button><span id="cn"></span><button class="logo" id="logo" aria-label="Slopcord"></button></header>
    <div class="msgs" id="msgs"></div>
    <div class="cmp"><input id="in" autocomplete="off" enterkeyhint="send"></div>
  </main>
  <aside class="mem" id="mem"></aside>
  <div class="auth" id="srv" hidden>
    <div class="card">
      <h1 id="sh">Create a server</h1>
      <p id="sp">Pick a name for your server.</p>
      <input id="sname" maxlength="30" placeholder="Server name" autocomplete="off">
      <div class="err" id="serr" role="alert"></div>
      <button class="btn" id="sgo">Create server</button>
      <button class="lnk" id="sal"></button>
      <button class="lnk" id="scx">Cancel</button>
    </div>
  </div>
  <div class="auth" id="auth" hidden>
    <div class="card">
      <h1>Slopcord</h1>
      <p id="ah"></p>
      <div class="chips" id="chips"></div>
      <input id="em" type="email" placeholder="Email" autocomplete="email" autocapitalize="none" hidden>
      <input id="un" placeholder="Username" autocomplete="username" autocapitalize="none">
      <input id="cd" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" hidden>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <ul class="rules" id="rules" hidden><li id="r1">At least 8 characters</li><li id="r2">A number or symbol, like 1 or @</li></ul>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="ago"></button>
      <button class="lnk" id="fgt">Forgot password?</button>
      <button class="lnk" id="alt"></button>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const DS=[];
// Email codes: paste your EmailJS values between the quotes. Leave empty to skip email checks.
const MAIL={service:'service_st7evwk',template:'template_2dnlf7o',key:'wwgkFI5ZxceSrYYp5'};
const mailOn=()=>!!(MAIL.service&&MAIL.template&&MAIL.key);
let pend=null;
const PAL=['#5865f2','#3ba55d','#eb459e','#e67e22','#3498db','#9b59b6','#e74c3c'];
const ld=(k,d)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=ld('slopcord:users',{}),M=ld('slopcord:msgs',{}),nav=ld('slopcord:nav',{sv:'',ch:''}),me=ld('slopcord:me',null),mode='in';
if(me&&!U[me])me=null;
let CS=ld('slopcord:servers',[]);const all=()=>DS.concat(CS);
const code=()=>(Math.random().toString(36)+'000000').slice(2,8).toUpperCase();
if(CS.some(v=>!v.k)){CS.forEach(v=>{if(!v.k){v.k=code();v.m=[v.o]}});put('slopcord:servers',CS)}
const vis=()=>DS.concat(CS.filter(x=>x.m.includes(me)));
const col=n=>U[n]?U[n].c:'#747f8d';
const key=()=>nav.sv+'/'+nav.ch;
const tm=ts=>new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const okPw=p=>({a:p.length>=8,b:/[^\p{L}\s]/u.test(p)});
function rules(){const r=okPw($('#pw').value);$('#r1').className=r.a?'ok':'';$('#r2').className=r.b?'ok':''}
const hx=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');

function drawMsgs(){
  const box=$('#msgs'),ms=M[key()]||[];
  box.replaceChildren();
  if(!ms.length)box.append(h('p','empty',nav.sv?'This is the start of #'+nav.ch+'. Send the first message.':'You’re not in a server yet. Tap + in the server list to create one, or join one with an invite code.'));
  ms.forEach((m,i)=>{
    const p=ms[i-1],f=!p||p.u!==m.u||m.ts-p.ts>3e5,row=h('div','m'+(f?' f':''));
    if(f){const a=h('div','av',m.u[0].toUpperCase());a.style.background=col(m.u);row.append(a)}else row.append(h('div','sp'));
    const b=h('div');
    if(f){const hd=h('div');hd.append(h('span','nm',m.u),h('span','tm',tm(m.ts)));b.append(hd)}
    b.append(h('div','tx',m.t));row.append(b);box.append(row);
  });
  box.scrollTop=box.scrollHeight;
}
function render(){
  const s=vis().find(x=>x.id===nav.sv)||vis()[0]||{id:'',n:'No servers yet',ch:[],m:me?[me]:[]},r=$('#rail'),l=$('#chl'),m=$('#mem');
  if(nav.sv!==s.id)nav={sv:s.id,ch:s.ch[0]||''};
  r.replaceChildren();l.replaceChildren();m.replaceChildren();
  vis().forEach(v=>{
    const b=h('button','sv'+(v.id===nav.sv?' on':''),v.i);
    b.style.setProperty('--c',v.c);b.title=v.n;b.setAttribute('aria-label',v.n);
    b.onclick=()=>{nav={sv:v.id,ch:v.ch[0]};put('slopcord:nav',nav);render()};
    r.append(b);
  });
  const ad=h('button','sv','+');ad.title='Create a server';ad.setAttribute('aria-label','Create a server');ad.style.setProperty('--c','#3ba55d');
  ad.onclick=()=>{if(!me)return;smode='new';sUI();$('#srv').hidden=false;$('#sname').focus()};r.append(ad);
  $('#sn').textContent=s.n;
  s.ch.forEach(c=>{
    const b=h('button','ch'+(c===nav.ch?' on':''),'# '+c);
    b.onclick=()=>{nav.ch=c;put('slopcord:nav',nav);$('#app').classList.remove('open');render()};
    l.append(b);
  });
  if(s.k){const iv=h('button','lnk','Invite code: '+s.k);iv.onclick=async()=>{try{await navigator.clipboard.writeText(s.k);iv.textContent='Copied '+s.k}catch(e){}};l.append(iv)}
  $('#cn').textContent=s.id?'# '+nav.ch:'';$('#in').disabled=!s.id;
  $('#in').placeholder=s.id?'Message #'+nav.ch:'Create or join a server to chat';
  const names=s.m||Object.keys(U);
  m.append(h('p','',(s.m?'Members, ':'On this device, ')+names.length));
  names.forEach(n=>{
    const row=h('div','me'),a=h('div','av',n[0].toUpperCase());a.style.background=col(n);
    row.append(a,h('span','nm',n+(n===me?' (you)':'')));m.append(row);
  });
  const mv=$('#mav');mv.textContent=me?me[0].toUpperCase():'';mv.style.background=col(me);
  $('#mnm').textContent=me||'';
  drawMsgs();
}
const MODES={
  in:{t:()=>Object.keys(U).length?'Tap an account to switch, or log in.':'Log in to continue.',v:'un pw fgt chips',go:'Log in',alt:'Need an account? Create one'},
  up:{t:()=>'Create a new account.',v:'em un pw rules',go:'Create account',alt:'Already have an account? Log in'},
  vc:{t:()=>'Enter the 6-digit code we emailed to '+pend.e+'. Check spam if you don’t see it.',v:'cd',go:'Verify email',alt:'Back'},
  fp:{t:()=>'Enter your account email and we’ll send you a code.',v:'em',go:'Send code',alt:'Back to log in'},
  rc:{t:()=>'Enter the code we emailed to '+pend.e+' (check spam if it’s missing), then a new password.',v:'cd pw rules',go:'Reset password',alt:'Back to log in'}
};
function authUI(){
  const d=MODES[mode],v=d.v.split(' ');
  $('#auth').hidden=false;
  $('#ah').textContent=d.t();$('#ago').textContent=d.go;$('#alt').textContent=d.alt;
  ['un','pw','em','cd','rules','chips','fgt'].forEach(i=>$('#'+i).hidden=!v.includes(i));
  $('#err').textContent='';$('#pw').value='';$('#cd').value='';
  $('#pw').placeholder=mode==='rc'?'New password':'Password';
  $('#pw').autocomplete=mode==='in'?'current-password':'new-password';
  $('#un').placeholder=mode==='in'?'Username or email':'Username';rules();
  const c=$('#chips');c.replaceChildren();
  if(mode==='in')Object.keys(U).forEach(n=>{const b=h('button','chip',n);b.onclick=()=>login(n);c.append(b)});
}
function login(n){me=n;put('slopcord:me',n);$('#auth').hidden=true;$('#un').value='';$('#pw').value='';$('#cd').value='';render()}
const say=m=>{$('#err').textContent=m};
const salt=()=>[...crypto.getRandomValues(new Uint32Array(2))].join('-');
async function sendCode(to){
  const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:MAIL.service,template_id:MAIL.template,user_id:MAIL.key,template_params:{to_email:to,code:c,app:'Slopcord'}})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));
  return c;
}
async function sendTo(em,next){
  const b=$('#ago');b.disabled=true;
  try{pend.c=await sendCode(em);pend.x=Date.now()+6e5;mode=next;authUI()}
  catch(x){say('Couldn’t send the email ('+(x.message||'network error')+'). Check the address and try again.')}
  b.disabled=false;
}
async function finish(){
  const s=salt(),n=pend.n;
  U[n]={s,e:pend.e,v:mailOn()?1:0,h:await hx(pend.p,s),c:PAL[Object.keys(U).length%PAL.length]};
  put('slopcord:users',U);pend=null;login(n);
}
async function go(){
  if(!window.crypto||!crypto.subtle)return say('Accounts need a secure (https) page.');
  say('');
  if(mode==='in'){
    const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
    const k=Object.keys(U).find(x=>x.toLowerCase()===n||(U[x].e&&U[x].e===n));
    if(!k||await hx(p,U[k].s)!==U[k].h)return say('Wrong username, email or password.');
    login(k);
  }else if(mode==='up'){
    const n=$('#un').value.trim(),p=$('#pw').value,em=$('#em').value.trim().toLowerCase();
    if(!/^[\w.-]{3,20}$/.test(n))return say('Username: 3 to 20 letters, numbers, dots, dashes or underscores.');
    if(Object.keys(U).some(x=>x.toLowerCase()===n.toLowerCase()))return say('That username is taken.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return say('Enter a valid email address.');
    if(Object.values(U).some(u=>u.e===em))return say('That email already has an account.');
    const r=okPw(p);if(!r.a||!r.b)return say('Password needs 8+ characters and a number or symbol like @.');
    pend={n,p,e:em};
    if(!mailOn())return finish();
    await sendTo(em,'vc');
  }else if(mode==='vc'){
    if(Date.now()>pend.x)return say('That code expired. Go back and try again.');
    if($('#cd').value.trim()!==pend.c)return say('That code is not right.');
    await finish();
  }else if(mode==='fp'){
    const em=$('#em').value.trim().toLowerCase();
    if(!mailOn())return say('Email sending isn’t set up yet. Add your EmailJS keys to the app file first.');
    const k=Object.keys(U).find(x=>U[x].e===em);
    if(!k)return say('No account uses that email.');
    pend={u:k,e:em};await sendTo(em,'rc');
  }else if(mode==='rc'){
    if(Date.now()>pend.x)return say('That code expired. Go back and try again.');
    if($('#cd').value.trim()!==pend.c)return say('That code is not right.');
    const p=$('#pw').value,r=okPw(p);
    if(!r.a||!r.b)return say('Password needs 8+ characters and a number or symbol like @.');
    const u=U[pend.u],n=pend.u;u.s=salt();u.h=await hx(p,u.s);put('slopcord:users',U);pend=null;login(n);
  }
}
$('#ago').onclick=go;
$('#pw').oninput=rules;
['un','pw','em','cd'].forEach(i=>$('#'+i).onkeydown=e=>{if(e.key==='Enter')go()});
$('#fgt').onclick=()=>{mode='fp';authUI()};
$('#alt').onclick=()=>{mode={in:'up',up:'in',vc:'up'}[mode]||'in';authUI()};
$('#sw').onclick=()=>{me=null;put('slopcord:me',null);mode='in';authUI()};
$('#in').onkeydown=e=>{
  const v=e.target.value.trim();
  if(e.key!=='Enter'||!v||!me||!nav.sv)return;
  (M[key()]=M[key()]||[]).push({u:me,t:v,ts:Date.now()});put('slopcord:msgs',M);
  e.target.value='';drawMsgs();
};
let smode='new';
function sUI(){const j=smode==='join';$('#sh').textContent=j?'Join a server':'Create a server';$('#sp').textContent=j?'Enter the invite code from a friend.':'Pick a name for your server.';$('#sname').placeholder=j?'Invite code':'Server name';$('#sgo').textContent=j?'Join server':'Create server';$('#sal').textContent=j?'Want to create one instead?':'Have an invite code? Join a server';$('#sname').value='';$('#serr').textContent=''}
$('#sal').onclick=()=>{smode=smode==='join'?'new':'join';sUI();$('#sname').focus()};
function jn(){
  const e=$('#serr'),c=$('#sname').value.trim().toUpperCase(),v=CS.find(x=>x.k===c);
  if(!v){e.textContent='No server with that code.';return}
  if(!v.m.includes(me)){v.m.push(me);put('slopcord:servers',CS)}
  nav={sv:v.id,ch:v.ch[0]};put('slopcord:nav',nav);$('#srv').hidden=true;$('#app').classList.remove('open');render();
}
function mk(){if(smode==='join'){jn();return}
  const n=$('#sname').value.trim(),e=$('#serr');
  if(n.length<2){e.textContent='Name needs at least 2 characters.';return}
  if(all().some(x=>x.n.toLowerCase()===n.toLowerCase())){e.textContent='That server name is taken.';return}
  const v={id:'s'+Date.now(),n,i:[...n][0].toUpperCase(),c:PAL[(CS.length+3)%PAL.length],o:me,k:code(),m:[me],ch:['general']};
  CS.push(v);put('slopcord:servers',CS);nav={sv:v.id,ch:'general'};put('slopcord:nav',nav);
  $('#srv').hidden=true;$('#app').classList.remove('open');render();
}
$('#sgo').onclick=mk;
$('#sname').onkeydown=e=>{if(e.key==='Enter')mk()};
$('#scx').onclick=()=>{$('#srv').hidden=true};
const lg=$('#logo');[...'Slopcord'].forEach((c,i)=>{const s=h('span','',c);s.style.setProperty('--i',i);lg.append(s)});
const hop=()=>{lg.classList.remove('go');void lg.offsetWidth;lg.classList.add('go')};
lg.onclick=hop;
$('#menu').onclick=()=>$('#app').classList.add('open');
$('#scrim').onclick=()=>$('#app').classList.remove('open');
render();
if(!me){mode=Object.keys(U).length?'in':'up';authUI()}
hop();
</script>
</body>
