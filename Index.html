<style>
:root{--bg:#fff;--bg2:#f2f3f5;--bg3:#e3e5e8;--tx:#313338;--mut:#5c5e66;--hov:#d9dbde;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg3);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--tx:#dbdee1;--mut:#949ba4;--hov:#393c41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--tx:#dbdee1;--mut:#949ba4;--hov:#393c41;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"gg sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid #5865f2;outline-offset:2px}
.app{display:flex;height:100%;position:relative;overflow:hidden}
.side{display:flex;flex:none}
.rail{width:72px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
.sv{width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);color:var(--tx);font-size:18px;font-weight:600;cursor:pointer;transition:border-radius .15s,background .15s}
.sv:hover,.sv.on{border-radius:16px;background:var(--c);color:#fff}
.chs{width:240px;background:var(--bg2);display:flex;flex-direction:column}
.chs h2{margin:0;padding:0 16px;height:48px;line-height:48px;font-size:15px;border-bottom:1px solid var(--bg3)}
.chl{flex:1;overflow-y:auto;padding:8px}
.ch{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mut);padding:8px 10px;border-radius:4px;font-size:15px;font-weight:500;cursor:pointer}
.ch:hover,.ch.on{background:var(--hov);color:var(--tx)}
.me{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:0 12px;height:48px;border-bottom:1px solid var(--bg3);font-weight:600;flex:none}
.menu{display:none;border:0;background:none;font-size:22px;cursor:pointer;padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:16px 0}
.m{display:flex;gap:12px;padding:2px 16px}
.m.f{margin-top:14px}
.m:hover{background:var(--bg2)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600}
.sp{width:40px;flex:none}
.nm{font-weight:600}
.tm{color:var(--mut);font-size:12px;margin-left:8px}
.tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.empty{color:var(--mut);padding:0 16px}
.cmp{padding:0 16px 16px;flex:none}
.cmp input{width:100%;box-sizing:border-box;border:0;border-radius:8px;background:var(--bg3);padding:12px 14px;font-size:16px}
.mem{width:240px;background:var(--bg2);padding:16px 8px;overflow-y:auto;flex:none}
.mem p{margin:0 8px 8px;color:var(--mut);font-size:13px}
.mem .me{background:none;border-radius:4px}
.scrim{display:none}
@media(max-width:900px){.mem{display:none}}
@media(max-width:700px){
.menu{display:block}
.side{position:absolute;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;z-index:5}
.app.open .side{transform:none}
.app.open .scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:4}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg3);padding:16px;overflow:auto}
[hidden]{display:none!important}
.card{width:100%;max-width:380px;background:var(--bg);border-radius:8px;padding:24px;box-sizing:border-box}
.card h1{margin:0 0 4px;font-size:24px}
.card p{color:var(--mut);margin:0 0 16px}
.card input{width:100%;box-sizing:border-box;border:0;border-radius:4px;background:var(--bg3);padding:12px;font-size:16px;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:4px;background:#5865f2;color:#fff;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
.lnk{background:none;border:0;color:#5865f2;cursor:pointer;padding:8px 0;font-size:14px}
.err{color:#da373c;min-height:20px;font-size:14px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:0;border-radius:12px;background:var(--bg3);padding:6px 10px;cursor:pointer;font-size:14px}
.rules{list-style:none;margin:0 0 12px;padding:0;font-size:14px;color:var(--mut)}
.rules li::before{content:"○ "}
.rules li.ok{color:#3ba55d}
.rules li.ok::before{content:"✓ "}
.logo{margin-left:auto;border:0;background:none;cursor:pointer;font-size:18px;font-weight:800;letter-spacing:.5px;color:#5865f2;padding:4px 6px}
.logo span{display:inline-block}
.logo.go span{animation:hop .5s ease calc(var(--i)*60ms)}
@keyframes hop{0%,100%{transform:none;color:#5865f2}40%{transform:translateY(-9px) rotate(-10deg);color:#eb459e}}
@media(prefers-reduced-motion:reduce){.logo.go span{animation:none}}
.chl .lnk{display:block;padding:12px 10px 0;text-align:left}
.bar{display:flex;gap:8px;align-items:center}
.bar #in{flex:1;min-width:0;width:auto}
.ib{border:0;background:var(--bg3);border-radius:8px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none}
.ib.rec{background:#da373c}
.ib:disabled{opacity:.5;cursor:default}
.cerr{color:#da373c;font-size:14px;margin-bottom:4px}
.pic{display:block;max-width:min(320px,100%);max-height:320px;border-radius:8px;margin-top:4px}
.gp{padding:8px;background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;margin-bottom:8px;max-height:220px;overflow-y:auto}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.gc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.gp button{border:0;padding:0;background:none;cursor:pointer;border-radius:8px;overflow:hidden}
.gp img{width:100%;display:block;border-radius:8px}
.ib.t{font-size:13px;font-weight:700}
.gifm{display:block;width:140px;height:140px;border-radius:10px;margin-top:4px}
.gc .chip.on{background:#5865f2;color:#fff}
.sens{position:relative;display:inline-block;max-width:100%;overflow:hidden;border-radius:8px;margin-top:4px}
.sens .pic{margin-top:0}
.pic.blur{filter:blur(26px)}
.rv{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;border:0;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;font-size:14px;cursor:pointer}
.opt{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-size:15px;cursor:pointer}
.card .opt input{width:20px;height:20px;padding:0;margin:2px 0 0;flex:none;accent-color:#5865f2}
.msg audio,.m audio{display:block;margin-top:4px;max-width:100%}
.mark{display:block;color:var(--tx);overflow:visible;filter:drop-shadow(0 0 5px rgba(34,211,238,.55))}
.mark .hex{stroke-dasharray:168;stroke-dashoffset:168;animation:draw 1.1s ease-out forwards}
.mark .hex2{transform-origin:32px 32px;animation:rot 9s linear infinite}
.mark text{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.5,.4,1) .55s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes fup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lw{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lw .mark{width:56px;height:56px}
.lw h1{margin:0!important}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--bg3)}
#splash .mark{width:112px;height:112px}
#splash .sn{font-size:28px;font-weight:800;letter-spacing:.5px;animation:fup .6s ease .8s both}
#splash.out{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;background:var(--bg2);color:var(--tx);border:1px solid var(--bg3);border-left:3px solid #22d3ee;border-radius:12px;padding:12px 18px 12px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateX(130%);opacity:0;pointer-events:none;max-width:min(320px,calc(100vw - 32px))}
.toast.show{animation:tin .55s cubic-bezier(.2,1.4,.4,1) forwards,tout .4s ease 2.9s forwards}
@keyframes tin{from{transform:translateX(130%);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{from{transform:none;opacity:1}to{transform:translateX(130%);opacity:0}}
.ticon{position:relative;width:40px;height:40px;flex:none}
.ticon .mark{width:40px;height:40px;animation:tspin .9s cubic-bezier(.3,1.3,.5,1)}
@keyframes tspin{from{transform:rotate(-180deg) scale(.4)}to{transform:none}}
.sp{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ec4899;opacity:0;animation:burst .8s ease-out .25s}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
.tmsg{font-weight:600;font-size:15px}
@media(prefers-reduced-motion:reduce){.mark .hex{animation:none;stroke-dashoffset:0}.mark .hex2,.mark text,.ticon .mark,.sp,#splash .sn{animation:none}.toast.show{animation:none;transform:none;opacity:1}}
.card .lnk{display:block}
</style>
</head>

<body>

function render(){

    l.append(b);
  });
  if(s.k){const iv=h('button','lnk','Invite code: '+s.k);iv.onclick=async()=>{try{await navigator.clipboard.writeText(s.k);iv.textContent='Copied '+s.k}catch(e){}};l.append(iv);const ab=h('button','lnk','+ Add channel');ab.onclick=()=>{smode='ch';sUI();$('#srv').hidden=false;$('#sname').focus()};l.append(ab)}
  $('#cn').textContent=s.id?'# '+nav.ch:'';$('#in').disabled=$('#att').disabled=$('#mic').disabled=$('#gifb').disabled=!s.id;
  $('#in').placeholder=s.id?'Message #'+nav.ch:'Create or join a server to chat';
  const names=s.m||Object.keys(U);

  names.forEach(n=>{
    const row=h('div','me'),a=h('div','av',n[0].toUpperCase());a.style.background=col(n);
    row.append(a,h('span','nm',n+(n===me?' (you)':'')));m.append(row);
  });

const MODES={
  in:{t:()=>Object.keys(U).length?'Tap an account to switch, or log in.':'Log in to continue.',v:'un pw fgt chips',go:'Log in',alt:'Need an account? Create one'},
  up:{t:()=>'Create a new account.',v:'em un pw rules',go:'Create account',alt:'Already have an account? Log in'},
  vc:{t:()=>'Enter the 6-digit code we emailed to '+pend.e+'. Check spam if you don’t see it.',v:'cd',go:'Verify email',alt:'Back'},
  fp:{t:()=>'Enter your account email and we’ll send you a code.',v:'em',go:'Send code',alt:'Back to log in'},
  rc:{t:()=>'Enter the code we emailed to '+pend.e+' (check spam if it’s missing), then a new password.',v:'cd pw rules',go:'Reset password',alt:'Back to log in'}
};
function authUI(){
  const d=MODES[mode],v=d.v.split(' ');
  $('#auth').hidden=false;
  $('#ah').textContent=d.t();$('#ago').textContent=d.go;$('#alt').textContent=d.alt;
  ['un','pw','em','cd','rules','chips','fgt'].forEach(i=>$('#'+i).hidden=!v.includes(i));
  $('#err').textContent='';$('#pw').value='';$('#cd').value='';
  $('#pw').placeholder=mode==='rc'?'New password':'Password';
  $('#pw').autocomplete=mode==='in'?'current-password':'new-password';
  $('#un').placeholder=mode==='in'?'Username or email':'Username';rules();
  const c=$('#chips');c.replaceChildren();
  if(mode==='in')Object.keys(U).forEach(n=>{const b=h('button','chip',n);b.onclick=()=>login(n);c.append(b)});
}
function login(n){if((U[n].ban||0)>Date.now()){say('This account is banned until '+new Date(U[n].ban).toLocaleString()+'.');return}me=n;put('slopcord:me',n);$('#auth').hidden=true;$('#un').value='';$('#pw').value='';$('#cd').value='';render()}
const say=m=>{$('#err').textContent=m};
const salt=()=>[...crypto.getRandomValues(new Uint32Array(2))].join('-');
async function sendCode(to){
  const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:MAIL.service,template_id:MAIL.template,user_id:MAIL.key,template_params:{to_email:to,code:c,app:'Slopcord'}})});
  if(!r.ok)throw new Error('send');
  return c;
}
async function sendTo(em,next){
  const b=$('#ago');b.disabled=true;
  try{pend.c=await sendCode(em);pend.x=Date.now()+6e5;mode=next;authUI()}
  catch(x){say('Couldn’t send the email. Check the address and try again.')}
  b.disabled=false;
}
async function finish(){
  const s=salt(),n=pend.n;
  U[n]={s,e:pend.e,v:mailOn()?1:0,h:await hx(pend.p,s),c:PAL[Object.keys(U).length%PAL.length]};
  put('slopcord:users',U);pend=null;login(n);
}
async function go(){
  if(!window.crypto||!crypto.subtle)return say('Accounts need a secure (https) page.');
  say('');
  if(mode==='in'){
    const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
    const k=Object.keys(U).find(x=>x.toLowerCase()===n||(U[x].e&&U[x].e===n));
    if(!k||await hx(p,U[k].s)!==U[k].h)return say('Wrong username, email or password.');
    login(k);
  }else if(mode==='up'){
    const n=$('#un').value.trim(),p=$('#pw').value,em=$('#em').value.trim().toLowerCase();
    if(!/^[\w.-]{3,20}$/.test(n))return say('Username: 3 to 20 letters, numbers, dots, dashes or underscores.');
    if(Object.keys(U).some(x=>x.toLowerCase()===n.toLowerCase()))return say('That username is taken.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return say('Enter a valid email address.');
    if(Object.values(U).some(u=>u.e===em))return say('That email already has an account.');
    const r=okPw(p);if(!r.a||!r.b)return say('Password needs 8+ characters and a number or symbol like @.');
    pend={n,p,e:em};
    if(!mailOn())return finish();
    await sendTo(em,'vc');
  }else if(mode==='vc'){
    if(Date.now()>pend.x)return say('That code expired. Go back and try again.');
    if($('#cd').value.trim()!==pend.c)return say('That code is not right.');
    await finish();
  }else if(mode==='fp'){
    const em=$('#em').value.trim().toLowerCase();
    if(!mailOn())return say('Email sending isn’t set up yet. Add your EmailJS keys to the app file first.');
    const k=Object.keys(U).find(x=>U[x].e===em);
    if(!k)return say('No account uses that email.');
    pend={u:k,e:em};await sendTo(em,'rc');
  }else if(mode==='rc'){
    if(Date.now()>pend.x)return say('That code expired. Go back and try again.');
    if($('#cd').value.trim()!==pend.c)return say('That code is not right.');
    const p=$('#pw').value,r=okPw(p);
    if(!r.a||!r.b)return say('Password needs 8+ characters and a number or symbol like @.');
    const u=U[pend.u],n=pend.u;u.s=salt();u.h=await hx(p,u.s);put('slopcord:users',U);pend=null;login(n);
  }
}
$('#ago').onclick=go;
$('#pw').oninput=rules;
['un','pw','em','cd'].forEach(i=>$('#'+i).onkeydown=e=>{if(e.key==='Enter')go()});

$('#in').onkeydown=e=>{

let smode='new';
function sUI(){const T={new:['Create a server','Pick a name for your server.','Server name','Create server','Have an invite code? Join a server'],join:['Join a server','Enter the invite code from a friend.','Invite code','Join server','Want to create one instead?'],ch:['Add a channel','Pick a name, like memes or homework.','channel-name','Add channel','']}[smode];$('#sh').textContent=T[0];$('#sp').textContent=T[1];$('#sname').placeholder=T[2];$('#sgo').textContent=T[3];$('#sal').textContent=T[4];$('#sal').hidden=smode==='ch';$('#sname').value='';$('#serr').textContent=''}
$('#sal').onclick=()=>{smode=smode==='join'?'new':'join';sUI();$('#sname').focus()};
function jn(){
  const e=$('#serr'),c=$('#sname').value.trim().toUpperCase(),v=CS.find(x=>x.k===c);
  if(!v){e.textContent='No server with that code.';return}

const BAD=['fuck','fucker','fucking','fucked','motherfucker','shit','shitty','bullshit','bitch','bastard','asshole','pussy','cunt','slut','whore','nigger','nigga','faggot','retard','شرموطة','شرموط','منيوك','منيك','عرص','قحبة','كسمك','كس','زب'];
const LEET={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s'};
function bad(t){
  const n=t.toLowerCase().replace(/[013457@$]/g,c=>LEET[c]);
  return n.split(/[^a-z\u0600-\u06ff]+/).some(w=>w&&(BAD.includes(w)||BAD.includes(w.replace(/(.)\1{2,}/g,'$1'))));
}
function punish(){
  const n=me;U[n].ban=Date.now()+864e5;put('slopcord:users',U);
  me=null;put('slopcord:me',null);mode='in';authUI();
  say('Bad words aren’t allowed. '+n+' is banned until '+new Date(U[n].ban).toLocaleString()+'.');
}
let ft;function flash(m){const e=$('#cerr');e.textContent=m;clearTimeout(ft);ft=setTimeout(()=>{e.textContent=''},4500)}
function post(x){
  const k=key();(M[k]=M[k]||[]).push(Object.assign({u:me,ts:Date.now()},x));
  try{localStorage.setItem('slopcord:msgs',JSON.stringify(M))}catch(e){M[k].pop();flash('Storage is full, so that couldn’t be saved.')}
  drawMsgs();

const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=()=>{URL.revokeObjectURL(u);no()};i.src=u});
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open('slopcord',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
DB.catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const dbPut=(k,b)=>DB.then(d=>new Promise((ok,no)=>{const t=d.transaction('media','readwrite');t.objectStore('media').put(b,k);t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)}));
const dbGet=k=>DB.then(d=>new Promise((ok,no)=>{const q=d.transaction('media').objectStore('media').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const urls=new Map();
async function mediaUrl(id){
  if(urls.has(id))return urls.get(id);
  try{const b=await dbGet(id);if(!b)return null;const u=URL.createObjectURL(b);urls.set(id,u);return u}catch(e){return null}
}
async function postMedia(b,k){
  const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await dbPut(id,b)}catch(e){flash('Not enough storage on this device for that file.');return}
  post({mid:id,mk:k});
}
$('#att').onclick=()=>{if(pf().safe)return flash('Safe mode is on, so picture uploads are off.');$('#pick').click()};
$('#pick').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!me||!nav.sv)return;

  if(f.size>50*1024*1024)return flash('That file is over 50 MB.');
  try{
    const keep=['image/gif','image/webp','image/apng'].includes(f.type);
    await postMedia(keep?f:await shrink(f),'img');
  }catch(x){flash('Couldn’t read that picture.')}
};
let rec=null,chunks=[],rt;
$('#mic').onclick=async()=>{
  if(rec){rec.stop();return}
  if(!me||!nav.sv)return;
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),r=new MediaRecorder(st),mt=r.mimeType||'audio/mp4';

      st.getTracks().forEach(t=>t.stop());clearTimeout(rt);rec=null;
      $('#mic').textContent='🎤';$('#mic').classList.remove('rec');
      await postMedia(new Blob(chunks,{type:mt}),'au');
    };
    r.start();$('#mic').textContent='⏹';$('#mic').classList.add('rec');rt=setTimeout(()=>r.state!=='inactive'&&r.stop(),30000);

const TAGS={lol:['funny','react'],gg:['hype'],heart:['love'],party:['hype'],fire:['hype'],slop:['hype'],nope:['react','funny'],yes:['react']};
const CATS={all:'All',funny:'Funny',hype:'Hype',love:'Love',react:'Reactions'};
const gp=$('#gp'),grid=h('div','gg'),gc=h('div','gc');let cat='all';
function gdraw(){
  grid.replaceChildren();
  Object.keys(GIFS).filter(k=>cat==='all'||TAGS[k].includes(cat)).forEach(k=>{const b=h('button'),i=h('img');b.title=k;b.setAttribute('aria-label',k+' GIF');i.src=GIFS[k];i.alt=k;b.append(i);b.onclick=()=>{if(!me||!nav.sv)return;post({gif:k});gp.hidden=true};grid.append(b)});
  [...gc.children].forEach(c=>c.classList.toggle('on',c.dataset.c===cat));
}
Object.keys(CATS).forEach(c=>{const b=h('button','chip',CATS[c]);b.dataset.c=c;b.onclick=()=>{cat=c;gdraw()};gc.append(b)});
gp.append(gc,grid);gdraw();
const shown=new Set();
const pf=()=>Object.assign({blur:1,safe:0},(U[me]&&U[me].f)||{});
function sens(el,id){
  const f=pf();
  if(f.safe)return h('div','tx','🚫 Picture hidden by Safe mode');
  if(!f.blur||shown.has(id))return el;
  const w=h('div','sens'),b=h('button','rv','Tap to view');
  el.classList.add('blur');w.append(el,b);b.onclick=()=>{shown.add(id);el.classList.remove('blur');b.remove()};return w;
}
$('#flb').onclick=()=>{if(!me)return;const f=pf();$('#fblur').checked=!!f.blur;$('#fsafe').checked=!!f.safe;$('#fil').hidden=false};
$('#fblur').onchange=$('#fsafe').onchange=()=>{if(!me)return;U[me].f={blur:+$('#fblur').checked,safe:+$('#fsafe').checked};put('slopcord:users',U);drawMsgs()};
$('#fdone').onclick=()=>{$('#fil').hidden=true};
$('#gifb').onclick=()=>{if(!me||!nav.sv)return;gp.hidden=!gp.hidden};
function ac(){
  const e=$('#serr'),n=$('#sname').value.trim().toLowerCase().replace(/\s+/g,'-'),v=all().find(x=>x.id===nav.sv);
  if(!v||!v.k)return;
  if(!/^[a-z0-9-]{2,24}$/.test(n)){e.textContent='Use 2 to 24 letters, numbers or dashes.';return}
  if(v.ch.includes(n)){e.textContent='That channel already exists.';return}
  v.ch.push(n);put('slopcord:servers',CS);toast('Channel #'+n+' added');nav.ch=n;put('slopcord:nav',nav);$('#srv').hidden=true;$('#app').classList.remove('open');render();
}
function mk(){if(smode==='ch'){ac();return}if(smode==='join'){jn();return}
  const n=$('#sname').value.trim(),e=$('#serr');
  if(n.length<2){e.textContent='Name needs at least 2 characters.';return}
  if(all().some(x=>x.n.toLowerCase()===n.toLowerCase())){e.textContent='That server name is taken.';return}
  const v={id:'s'+Date.now(),n,i:[...n][0].toUpperCase(),c:PAL[(CS.length+3)%PAL.length],o:me,k:code(),m:[me],ch:['general']};
  CS.push(v);put('slopcord:servers',CS);toast('Server “'+n+'” created');nav={sv:v.id,ch:'general'};put('slopcord:nav',nav);
  $('#srv').hidden=true;$('#app').classList.remove('open');render();
}
$('#sgo').onclick=mk;
$('#sname').onkeydown=e=>{if(e.key==='Enter')mk()};
$('#scx').onclick=()=>{$('#srv').hidden=true};
const lg=$('#logo');[...'Slopcord'].forEach((c,i)=>{const s=h('span','',c);s.style.setProperty('--i',i);lg.append(s)});
const hop=()=>{lg.classList.remove('go');void lg.offsetWidth;lg.classList.add('go')};
lg.onclick=hop;
$('#menu').onclick=()=>$('#app').classList.add('open');
$('#scrim').onclick=()=>$('#app').classList.remove('open');
render();
if(!me){mode=Object.keys(U).length?'in':'up';authUI()}
hop();
</script>
